app:
  name: Deep Research Agent
  mode: workflow
  icon: 🔎
  icon_background: '#E0F2FE'
  use_icon_as_answer_icon: false
  description: Plan -> SearXNG search (iteration) + Wikipedia (parallel) -> cited
    Markdown report with citation validation.
kind: app
version: 0.3.1
dependencies:
- type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/ollama:1.0.3@1086758302d98263d5b7881de8ba95fc219351fdf97831d18a7807378674d203
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 0
        y: 300
      positionAbsolute:
        x: 0
        y: 300
      width: 244
      height: 90
      sourcePosition: right
      targetPosition: left
      data:
        desc: ''
        selected: false
        type: start
        title: Start
        variables:
        - variable: topic
          label: topic
          type: paragraph
          required: true
          max_length: 500
          options: []
        - variable: depth
          label: depth (3-5)
          type: number
          required: false
          options: []
    - id: planner
      type: custom
      position:
        x: 300
        y: 200
      positionAbsolute:
        x: 300
        y: 200
      width: 244
      height: 90
      sourcePosition: right
      targetPosition: left
      data:
        desc: ''
        selected: false
        type: llm
        title: Planner
        model: &id001
          provider: langgenius/ollama/ollama
          name: qwen2.5:7b
          mode: chat
          completion_params:
            temperature: 0.2
            num_ctx: 16384
        prompt_template:
        - role: system
          text: You plan web research. Reply with ONLY a JSON array of short search-engine
            queries (strings). No prose.
        - role: user
          text: 'Topic: {{#start.topic#}}

            Write {{#start.depth#}} (default 4) distinct search queries that together
            cover background, current state, key players or tools, and open problems.'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        memory: null
    - id: parse
      type: custom
      position:
        x: 600
        y: 200
      positionAbsolute:
        x: 600
        y: 200
      width: 244
      height: 90
      sourcePosition: right
      targetPosition: left
      data:
        desc: ''
        selected: false
        type: code
        title: Parse plan
        code_language: python3
        variables:
        - variable: text
          value_selector:
          - planner
          - text
        - variable: topic
          value_selector:
          - start
          - topic
        - variable: depth
          value_selector:
          - start
          - depth
        outputs:
          questions:
            type: array[string]
            children: null
        code: "\"\"\"Pure-Python logic used by the Dify Code nodes.\n\nEach public\
          \ function mirrors one Code node. Keep them dependency-free so the\nsame\
          \ body can be pasted into Dify's sandbox and unit-tested here.\n\"\"\"\n\
          \nimport json\nimport re\nfrom urllib.parse import parse_qsl, urlencode,\
          \ urlsplit, urlunsplit\n\nTRACKING = {\"utm_source\", \"utm_medium\", \"\
          utm_campaign\", \"utm_term\", \"utm_content\",\n            \"fbclid\",\
          \ \"gclid\", \"ref\"}\n\n\ndef parse_plan(llm_text: str, topic: str, max_q:\
          \ int = 5) -> list[str]:\n    \"\"\"Parse planner output into sub-questions;\
          \ fall back to the topic itself.\"\"\"\n    m = re.search(r\"\\[.*\\]\"\
          , llm_text or \"\", re.DOTALL)\n    qs: list[str] = []\n    if m:\n    \
          \    try:\n            data = json.loads(m.group(0))\n            qs = [str(q).strip()\
          \ for q in data if str(q).strip()]\n        except json.JSONDecodeError:\n\
          \            qs = []\n    if not qs:\n        qs = [ln.strip(\" -*0123456789.\"\
          ).strip() for ln in (llm_text or \"\").splitlines()]\n        qs = [q for\
          \ q in qs if q.endswith(\"?\")]\n    seen, out = set(), []\n    for q in\
          \ qs:\n        if q.lower() not in seen:\n            seen.add(q.lower());\
          \ out.append(q)\n    return out[:max_q] or [topic]\n\n\ndef normalize_url(url:\
          \ str) -> str:\n    p = urlsplit(url.strip())\n    query = urlencode([(k,\
          \ v) for k, v in parse_qsl(p.query) if k.lower() not in TRACKING])\n   \
          \ host = p.netloc.lower().removeprefix(\"www.\")\n    path = p.path.rstrip(\"\
          /\") or \"/\"\n    return urlunsplit((\"https\" if p.scheme in (\"http\"\
          , \"https\") else p.scheme, host, path, query, \"\"))\n\n\ndef pick_results(searxng_json:\
          \ str | dict, k: int = 3) -> list[dict]:\n    \"\"\"Take a SearXNG /search?format=json\
          \ response, dedupe, keep top k.\"\"\"\n    data = json.loads(searxng_json)\
          \ if isinstance(searxng_json, str) else searxng_json\n    out, seen = [],\
          \ set()\n    for r in data.get(\"results\", []):\n        url = r.get(\"\
          url\")\n        if not url or not url.startswith((\"http://\", \"https://\"\
          )):\n            continue\n        key = normalize_url(url)\n        if\
          \ key in seen:\n            continue\n        seen.add(key)\n        out.append({\"\
          title\": r.get(\"title\", \"\").strip(), \"url\": url,\n               \
          \     \"snippet\": (r.get(\"content\") or \"\").strip()[:500]})\n      \
          \  if len(out) >= k:\n            break\n    return out\n\n\ndef build_registry(per_question:\
          \ list[list[dict]]) -> list[dict]:\n    \"\"\"Merge results from all sub-questions\
          \ into one numbered source list.\"\"\"\n    reg, index = [], {}\n    for\
          \ results in per_question:\n        for r in results:\n            key =\
          \ normalize_url(r[\"url\"])\n            if key not in index:\n        \
          \        index[key] = len(reg) + 1\n                reg.append({\"id\":\
          \ index[key], **r})\n    return reg\n\n\ndef format_sources(reg: list[dict],\
          \ max_chars: int = 600) -> str:\n    return \"\\n\".join(f\"[{s['id']}]\
          \ {s['title']} - {s['url']}\\n{s['snippet'][:max_chars]}\"\n           \
          \          for s in reg)\n\n\nREF = r\"(?:n|source|src|#)?\\s*\\d+\"\nCITE\
          \ = re.compile(r\"\\[(\" + REF + r\"(?:\\s*[,;]\\s*\" + REF + r\")*)\\]\"\
          , re.IGNORECASE)\n\n\ndef validate_citations(report: str, reg: list[dict])\
          \ -> dict:\n    \"\"\"Drop citations to unknown sources, rebuild References,\
          \ report stats.\n\n    Checks citation integrity only - not whether the\
          \ claim is supported.\n    \"\"\"\n    valid = {s[\"id\"] for s in reg}\n\
          \    used, invalid = set(), set()\n\n    def fix(m: re.Match) -> str:\n\
          \        nums = [int(n) for n in re.findall(r\"\\d+\", m.group(1))]\n  \
          \      keep = [n for n in nums if n in valid]\n        invalid.update(n\
          \ for n in nums if n not in valid)\n        used.update(keep)\n        return\
          \ \"[\" + \", \".join(map(str, keep)) + \"]\" if keep else \"\"\n\n    body\
          \ = re.split(r\"\\n#+\\s*References\\b\", report, maxsplit=1, flags=re.IGNORECASE)[0]\n\
          \    body = CITE.sub(fix, body).rstrip()\n    refs = \"\\n\".join(f\"{s['id']}.\
          \ [{s['title'] or s['url']}]({s['url']})\"\n                      for s\
          \ in reg if s[\"id\"] in used)\n    text = \"\\n\".join(ln for ln in body.splitlines()\
          \ if not ln.lstrip().startswith(\"#\"))\n    paras = [p for p in re.split(r\"\
          \\n\\s*\\n|\\n(?=\\s*[-*] )\", text) if p.strip()]\n    uncited = sum(1\
          \ for p in paras if not CITE.search(p))\n    return {\"report\": body +\
          \ \"\\n\\n## References\\n\\n\" + (refs or \"_No sources cited._\") + \"\
          \\n\",\n            \"cited\": sorted(used), \"invalid_removed\": sorted(invalid),\n\
          \            \"uncited_paragraphs\": uncited, \"sources_total\": len(reg)}\n\
          \n\ndef main(text: str, topic: str, depth=None) -> dict:\n    n = int(depth)\
          \ if depth else 4\n    return {\"questions\": parse_plan(text, topic, max(3,\
          \ min(n, 5)))}\n"
    - id: iter
      type: custom
      position:
        x: 900
        y: 150
      positionAbsolute:
        x: 900
        y: 150
      width: 640
      height: 200
      zIndex: 1
      data:
        type: iteration
        title: Search each question
        desc: ''
        selected: false
        iterator_selector:
        - parse
        - questions
        iterator_input_type: array[string]
        output_selector:
        - pick
        - results_json
        output_type: array[string]
        start_node_id: iterstart
        is_parallel: true
        parallel_nums: 3
        error_handle_mode: continue-on-error
        width: 640
        height: 200
    - id: iterstart
      type: custom-iteration-start
      parentId: iter
      position:
        x: 24
        y: 68
      positionAbsolute:
        x: 924
        y: 218
      width: 44
      height: 48
      zIndex: 1002
      draggable: false
      selectable: false
      data:
        type: iteration-start
        title: ''
        desc: ''
        isInIteration: true
        selected: false
    - id: search
      type: custom
      position:
        x: 1000
        y: 230
      positionAbsolute:
        x: 1000
        y: 230
      width: 244
      height: 90
      sourcePosition: right
      targetPosition: left
      data:
        desc: ''
        selected: false
        type: http-request
        title: SearXNG search
        method: get
        url: http://searxng:8080/search
        authorization:
          type: no-auth
          config: null
        headers: ''
        params: 'q:{{#iter.item#}}

          format:json'
        body:
          type: none
          data: []
        timeout:
          connect: 10
          read: 30
          write: 30
        retry_config:
          enabled: true
          max_retries: 2
          retry_interval: 1000
        error_strategy: default-value
        default_value:
        - key: body
          type: string
          value: '{"results": []}'
        - key: status_code
          type: number
          value: 0
        isInIteration: true
        isInLoop: false
        iteration_id: iter
      parentId: iter
      zIndex: 1002
    - id: pick
      type: custom
      position:
        x: 1300
        y: 230
      positionAbsolute:
        x: 1300
        y: 230
      width: 244
      height: 90
      sourcePosition: right
      targetPosition: left
      data:
        desc: ''
        selected: false
        type: code
        title: Dedupe + top 3
        code_language: python3
        variables:
        - variable: body
          value_selector:
          - search
          - body
        outputs:
          results_json:
            type: string
            children: null
        code: "\"\"\"Pure-Python logic used by the Dify Code nodes.\n\nEach public\
          \ function mirrors one Code node. Keep them dependency-free so the\nsame\
