          \ \"\\n\\n## References\\n\\n\" + (refs or \"_No sources cited._\") + \"\
          \\n\",\n            \"cited\": sorted(used), \"invalid_removed\": sorted(invalid),\n\
          \            \"uncited_paragraphs\": uncited, \"sources_total\": len(reg)}\n\
          \n\ndef main(per_q: list, wiki: str) -> dict:\n    lists = []\n    for s\
          \ in per_q or []:\n        try:\n            lists.append(json.loads(s)\
          \ if s else [])\n        except Exception:\n            pass\n    try:\n\
          \        lists.insert(0, pick_results(wiki or '{\"results\": []}', k=1))\n\
          \    except Exception:\n        pass\n    reg = build_registry(lists)\n\
          \    return {\"registry\": json.dumps(reg), \"sources_text\": format_sources(reg)}\n"
